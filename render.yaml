services:
  - type: web
    name: vibe
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SUPABASE_URL    # Project URL из Supabase
        sync: false
      - key: SUPABASE_KEY    # secret / service_role ключ из Supabase (только здесь, не в index.html!)
        sync: false
      - key: TG_BOT_TOKEN
        sync: false
      - key: TG_BOT_NAME
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FRONT_URL       # адрес сайта на Netlify, например https://vibesssssss.netlify.app
        sync: false
      - key: PREMIUM_STARS
        value: "100"
      - key: TG_ADMIN_IDS    # необязательно
        sync: false
